applications:
  - name: spring-petclinic-4-1-2
    memory: 1024M
    instances: 1
    path: spring-petclinic-4.1.2/target/spring-petclinic-4.1.2.jar
    # path: spring-petclinic-4.1.2/build/libs/spring-petclinic-4.1.2.jar
    buildpack: java_buildpack_offline
    env:
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 25.+ } }'
      JAVA_OPTS: "-Dorg.apache.catalina.core.AprLifecycleListener.SSLEngine=off"
