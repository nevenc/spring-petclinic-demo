applications:
  - name: spring-petclinic-3-5-17-manually-patched
    memory: 1024M
    instances: 1
    path: spring-petclinic-3.5.17-manually-patched/target/spring-petclinic-3.5.17.jar
    # path: spring-petclinic-3.5.17-manually-patched/build/libs/spring-petclinic-3.5.17.jar
    buildpack: java_buildpack_offline
    env:
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 17.+ } }'
      JAVA_OPTS: "-Dorg.apache.catalina.core.AprLifecycleListener.SSLEngine=off"
