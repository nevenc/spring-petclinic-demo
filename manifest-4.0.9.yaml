applications:
  - name: spring-petclinic-4-0-9
    memory: 1024M
    instances: 1
    path: spring-petclinic-4.0.9/target/spring-petclinic-4.0.9.jar
    # path: spring-petclinic-4.0.9/build/libs/spring-petclinic-4.0.9.jar
    buildpack: java_buildpack_offline
    env:
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 25.+ } }'
      JAVA_OPTS: "-Dorg.apache.catalina.core.AprLifecycleListener.SSLEngine=off"
