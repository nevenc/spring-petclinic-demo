applications:
  - name: spring-petclinic-2-7-3
    memory: 1024M
    instances: 1
    path: spring-petclinic-2.7.3/target/spring-petclinic-2.7.3.jar
    # path: spring-petclinic-2.7.3/build/libs/spring-petclinic-2.7.3.jar
    buildpack: java_buildpack_offline
    env:
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 1.8.+ } }'
      JAVA_OPTS: "-Dorg.apache.catalina.core.AprLifecycleListener.SSLEngine=off"
