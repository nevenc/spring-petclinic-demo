applications:
  - name: spring-petclinic-3-5-16
    memory: 1024M
    instances: 1
    path: spring-petclinic-3.5.16/target/spring-petclinic-3.5.16.jar
    # path: spring-petclinic-3.5.16/build/libs/spring-petclinic-3.5.16.jar
    buildpack: java_buildpack_offline
    env:
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 17.+ } }'
      JAVA_OPTS: "-Dorg.apache.catalina.core.AprLifecycleListener.SSLEngine=off"
