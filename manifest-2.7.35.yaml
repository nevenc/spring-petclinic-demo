applications:
  - name: spring-petclinic-2-7-35
    memory: 1024M
    instances: 1
    path: spring-petclinic-2.7.35/target/spring-petclinic-2.7.35.jar
    # path: spring-petclinic-2.7.35/build/libs/spring-petclinic-2.7.35.jar
    buildpack: java_buildpack_offline
    env:
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 17.+ } }'
      JAVA_OPTS: "-Dorg.apache.catalina.core.AprLifecycleListener.SSLEngine=off"
